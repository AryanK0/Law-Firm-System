<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Pearson Specter Litt legal operations platform for matter management, IOLTA trust accounting, ethical walls, and contract intelligence."
    />
    <title>PSL Law — Legal Operations & IOLTA Trust Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Wix+Madefor+Display:wght@400;500;600&family=Wix+Madefor+Text:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.hallmarkSlots = (m) => {
        for (const [k, v] of Object.entries(m)) {
          const s = document.querySelector(`[data-slot="${k}"]`);
          if (!s) continue;
          const im = new Image();
          im.src = typeof v === "string" ? v : v.src;
          im.alt = (typeof v === "object" && v.alt) || s.dataset.alt || "";
          s.querySelectorAll(":scope > img").forEach((o) => o.remove());
          s.prepend(im);
        }
      };
      document.querySelectorAll("[data-slot] img").forEach((i) => {
        if (i.complete && !i.naturalWidth) i.remove();
        else i.addEventListener("error", () => i.remove(), { once: true });
      });
    </script>
  </body>
</html>
