# ==============================================================================
# Tier-1 Enterprise CI/CD Pipeline - SOC-2 Compliant Automated Quality Gate
# Validates: Multi-phase Pytest test suites, TypeScript compilation, Docker builds
# ==============================================================================

name: LFMS Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Backend Automated Test Matrix & Domain Verification
  # ----------------------------------------------------------------------------
  backend-test:
    name: Backend Test Suite (Python 3.12 + MySQL 8.0 + Redis 7)
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        command: redis-server --requirepass redispassword
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli -a redispassword ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Start MySQL 8.0 with Case-Insensitive Table Names
        run: |
          docker run -d \
            --name mysql \
            -p 3306:3306 \
            -e MYSQL_ROOT_PASSWORD=rootpassword \
            -e MYSQL_DATABASE=lawfirm \
            mysql:8.0 \
            mysqld --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --lower-case-table-names=1

      - name: Set up Python 3.12 Runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Enterprise Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Initialize MySQL Database Schema & Seed Data
        run: |
          echo "Waiting for MySQL container to become ready..."
          for i in $(seq 1 40); do
            if docker exec mysql mysqladmin ping -u root -prootpassword --silent; then
              echo "MySQL is up and ready!"
              break
            fi
            echo "Waiting for MySQL ($i/40)..."
            sleep 2
          done
          echo "Importing schema.sql..."
          docker exec -i mysql mysql -u root -prootpassword --default-character-set=utf8mb4 lawfirm < backend/sql/schema.sql
          echo "Importing access_control.sql..."
          docker exec -i mysql mysql -u root -prootpassword --default-character-set=utf8mb4 lawfirm < backend/sql/access_control.sql
          echo "Importing dbms_features.sql..."
          docker exec -i mysql mysql -u root -prootpassword --default-character-set=utf8mb4 lawfirm < backend/sql/dbms_features.sql
          echo "Importing advanced_features.sql..."
          docker exec -i mysql mysql -u root -prootpassword --default-character-set=utf8mb4 lawfirm < backend/sql/advanced_features.sql
          echo "Importing sample_data.sql..."
          docker exec -i mysql mysql -u root -prootpassword --default-character-set=utf8mb4 lawfirm < backend/sql/sample_data.sql
          echo "Verifying tables and lowercase case-insensitivity..."
          docker exec mysql mysql -u root -prootpassword -e "USE lawfirm; SELECT count(*) AS cases_count FROM cases; SELECT count(*) AS Cases_count FROM Cases; SELECT count(*) AS employee_count FROM employee; SELECT count(*) AS Employee_count FROM Employee;"

      - name: Run Full Multi-Phase Automated Test Suite (Phases 1-6)
        env:
          ENVIRONMENT: test
          DATABASE_URL: mysql+aiomysql://root:rootpassword@127.0.0.1:3306/lawfirm
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: lawfirm
          DB_USER: root
          DB_PASSWORD: rootpassword
          REDIS_URL: redis://:redispassword@127.0.0.1:6379/0
          JWT_SECRET: test-suite-secret-key-32-chars-minimum-soc2
        run: |
          python -m pytest backend/tests -v --durations=10

  # ----------------------------------------------------------------------------
  # Job 2: Frontend TypeScript Verification & Production Bundle Compilation
  # ----------------------------------------------------------------------------
  frontend-build:
    name: Frontend Build & Static Analysis (Node 22 + React 19 + Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22 Runtime
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Compile TypeScript & Build Production Bundle
        working-directory: frontend
        run: npm run build

  # ----------------------------------------------------------------------------
  # Job 3: Docker Multi-Stage Build & Compose Orchestration Gate
  # ----------------------------------------------------------------------------
  docker-validation:
    name: Docker Multi-Stage Container & Compose Gate
    runs-on: ubuntu-latest
    needs: [ backend-test, frontend-build ]

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Build Multi-Stage Backend Docker Image
        run: docker build -t lfms-backend:latest ./backend

      - name: Build Multi-Stage Frontend Nginx Docker Image
        run: docker build -t lfms-frontend:latest ./frontend
