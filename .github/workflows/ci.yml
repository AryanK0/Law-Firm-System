# ==============================================================================
# Tier-1 Enterprise CI/CD Pipeline - SOC-2 Compliant Quality & Verification Gate
# Validates: Java 21 LTS Enterprise Diagnostics Suite, React 19 Frontend Build, Docker Containers
# ==============================================================================

name: LFMS Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Java 21 LTS Enterprise Backend Diagnostics & Verification Suite
  # ----------------------------------------------------------------------------
  backend-test:
    name: Java 21 Enterprise Core Verification (Adoptium Temurin + MySQL 8.0)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: lawfirm
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -prootpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Java 21 LTS Runtime (Adoptium Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Initialize MySQL Database Schema & Seed Data
        run: |
          echo "Waiting for MySQL service container to be fully accessible..."
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -u root -prootpassword --silent; then
              echo "MySQL is reachable and ping succeeded!"
              break
            fi
            echo "Waiting for MySQL connection ($i/30)..."
            sleep 2
          done
          echo "Importing schema.sql..."
          mysql -h 127.0.0.1 -u root -prootpassword --default-character-set=utf8mb4 lawfirm < backend/sql/schema.sql
          echo "Importing access_control.sql..."
          mysql -h 127.0.0.1 -u root -prootpassword --default-character-set=utf8mb4 lawfirm < backend/sql/access_control.sql
          echo "Importing dbms_features.sql..."
          mysql -h 127.0.0.1 -u root -prootpassword --default-character-set=utf8mb4 lawfirm < backend/sql/dbms_features.sql
          echo "Importing advanced_features.sql..."
          mysql -h 127.0.0.1 -u root -prootpassword --default-character-set=utf8mb4 lawfirm < backend/sql/advanced_features.sql
          echo "Importing sample_data.sql..."
          mysql -h 127.0.0.1 -u root -prootpassword --default-character-set=utf8mb4 lawfirm < backend/sql/sample_data.sql
          echo "Importing phase4_features.sql..."
          mysql -h 127.0.0.1 -u root -prootpassword --default-character-set=utf8mb4 lawfirm < backend/sql/phase4_features.sql
          echo "Importing case_sensitivity_compat.sql..."
          mysql -h 127.0.0.1 -u root -prootpassword --default-character-set=utf8mb4 lawfirm < backend/sql/case_sensitivity_compat.sql

      - name: Compile Java Enterprise Core
        working-directory: backend
        run: |
          mkdir -p target/classes storage/exports storage/snapshots storage/s3_vault logs
          javac -cp "lib/*" -d target/classes $(find src/main/java -name "*.java")
          if [ -d "src/main/resources" ]; then cp -r src/main/resources/* target/classes/ 2>/dev/null || true; fi
          echo "Java 21 compilation succeeded."

      - name: Run 5-Subsystem Enterprise Diagnostic Verification Suite
        working-directory: backend
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: lawfirm
          DB_USER: root
          DB_PASSWORD: rootpassword
        run: |
          java -cp "target/classes:lib/*" com.psl.lawfirm.EnterpriseSystemRunner

  # ----------------------------------------------------------------------------
  # Job 2: Frontend TypeScript Verification & Production Bundle Compilation
  # ----------------------------------------------------------------------------
  frontend-build:
    name: Frontend Build & Static Analysis (Node 22 + React 19 + Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22 Runtime
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Compile TypeScript & Build Production Bundle
        working-directory: frontend
        run: npm run build

  # ----------------------------------------------------------------------------
  # Job 3: Docker Multi-Stage Build & Compose Orchestration Gate
  # ----------------------------------------------------------------------------
  docker-validation:
    name: Docker Multi-Stage Container & Compose Gate
    runs-on: ubuntu-latest
    needs: [ backend-test, frontend-build ]

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Build Multi-Stage Backend Java 21 Docker Image
        run: docker build -t lfms-backend:latest ./backend

      - name: Build Multi-Stage Frontend Nginx Docker Image
        run: docker build -t lfms-frontend:latest ./frontend
